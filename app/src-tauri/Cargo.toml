[package]
name = "monote"
version = "1.0.0"
description = "MoNote（墨记）—— 本地优先的个人 Markdown 笔记与知识管理工具"
authors = ["高亦满 <U202414900>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "monote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
notify = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
twox-hash = "1.6"
regex = "1"
encoding_rs = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
keyring = { version = "3", features = ["windows-native"] }
thiserror = "1"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
incremental = true
